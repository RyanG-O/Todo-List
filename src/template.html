<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
</head>
<body>
    <div id="sidebar">
        <a href="#"><i class="fa-solid fa-calendar"></i> Today</a>
        <hr>
        <a href="#"><i class="fa-solid fa-house"></i> Home</a>
        <hr>
        <a href="#"><i class="fa-solid fa-diagram-project"></i> Projects</a>
    </div>
    <div id="content">
        <h1 class="title">Todo</h1>
        <hr>
        <div class="project">
            <h2 class="project-title">Project</h2>
            <div class="todo">
                <button class="todo-button"></button>
                <div>
                    <p class="description">Walk the dog</p>
                    <p><i class="fa-solid fa-calendar-days"></i>Date</p>
                </div>
            </div>
            <hr>
            <div class="todo">
                <button class="todo-button">
                    <div></div>
                </button>
                <div>
                    <p class="description">Walk the dog</p>
                    <p class="date"><i class="fa-solid fa-calendar-days"></i>Date</p>
                </div>
            </div>
        </div>
    </div>
    <button id="add-button">+</button>
</body>
</html>
